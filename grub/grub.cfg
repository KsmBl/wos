set timeout=0
set default=0

# GRUB is the BIOS half of booting WOS and nothing more.  On a UEFI machine the
# firmware loads WOS's own loader (uefi/stub.c) directly, because GRUB cannot
# hand over to this kernel there at all: Multiboot, the Linux protocol and the
# EFI handover each end in a page fault inside GRUB, whose relocator writes to a
# page current firmware maps read-only.  See docs/usb.md.
#
# Deliberately no gfxmode or gfxterm here.  The kernel captures its 8x16 font
# from the card's text-mode font memory (vga_read_font16), and a bootloader that
# hands over in a graphics mode leaves nothing there to capture.  It carries a
# copy of the font for the UEFI path, but the captured one is the card's own.
#
# Asking for a mode would also make the switch mandatory, and GRUB aborts with
# "no suitable video mode found" wherever it cannot deliver one -- which is why
# the Multiboot header does not request video either.  Loading vga_text and
# selecting the plain console keeps the text mode GRUB is already displaying
# from depending on how the firmware's GRUB happens to be built.
if [ "$grub_platform" = "pc" ]; then
    insmod vga_text
    terminal_output console
fi

if [ "$grub_platform" = "efi" ]; then
    # Only reachable when this ISO is booted on a UEFI machine, where the
    # firmware ran GRUB's own boot file rather than ours.  Hand straight over
    # to the WOS loader; it does the rest without GRUB's help.
    menuentry "WOS" {
        chainloader /EFI/wos/BOOTX64.EFI
        boot
    }
else
    menuentry "WOS" {
        multiboot /boot/kernel.elf
        # The filesystem, in case this machine's boot device is one the kernel
        # cannot read (a USB stick: there is no USB driver).  A real ATA disk
        # holding a WFS volume still wins, because writes survive a reboot.
        module /boot/wos.img wfs
        boot
    }
fi
